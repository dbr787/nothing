# Benchmark cache definitions, generated by hand-in-step with probes/bench.py.
# Relative targets only, so this file parses on Linux, macOS and Windows.
# BENCH_ROUND keeps each benchmark round's addresses fresh (entries are write-once).
caches:
  - name: "bench_blob_s"
    cache_key:
      - "bench_blob_s"
      - agent: "os"
      - agent: "arch"
      - env: "BENCH_ROUND"
    target_paths:
      - "bk-bench-blob-s"
  - name: "bench_blob_m"
    cache_key:
      - "bench_blob_m"
      - agent: "os"
      - agent: "arch"
      - env: "BENCH_ROUND"
    target_paths:
      - "bk-bench-blob-m"
  - name: "bench_blob_l"
    cache_key:
      - "bench_blob_l"
      - agent: "os"
      - agent: "arch"
      - env: "BENCH_ROUND"
    target_paths:
      - "bk-bench-blob-l"
  - name: "bench_many_s"
    cache_key:
      - "bench_many_s"
      - agent: "os"
      - agent: "arch"
      - env: "BENCH_ROUND"
    target_paths:
      - "bk-bench-many-s"
  - name: "bench_many_m"
    cache_key:
      - "bench_many_m"
      - agent: "os"
      - agent: "arch"
      - env: "BENCH_ROUND"
    target_paths:
      - "bk-bench-many-m"
  - name: "bench_many_l"
    cache_key:
      - "bench_many_l"
      - agent: "os"
      - agent: "arch"
      - env: "BENCH_ROUND"
    target_paths:
      - "bk-bench-many-l"
  - name: "bench_text_s"
    cache_key:
      - "bench_text_s"
      - agent: "os"
      - agent: "arch"
      - env: "BENCH_ROUND"
    target_paths:
      - "bk-bench-text-s"
  - name: "bench_text_m"
    cache_key:
      - "bench_text_m"
      - agent: "os"
      - agent: "arch"
      - env: "BENCH_ROUND"
    target_paths:
      - "bk-bench-text-m"
  - name: "bench_text_l"
    cache_key:
      - "bench_text_l"
      - agent: "os"
      - agent: "arch"
      - env: "BENCH_ROUND"
    target_paths:
